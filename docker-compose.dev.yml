services:
  server:
    build:
      context: ./server
      dockerfile: docker/dev.Dockerfile
    ports:
      - '4000:4000'
      - '5555:5555'
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/demo?schema=public
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: docker/dev.Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: demo
    ports:
      - '5432:5432'
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
